[package]
name = "epd-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "EPD test-suite runner for UCI engines with a per-binary JSON result store"
publish = false

[dependencies]
rusty-rival = { path = "../.." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.29"
crossterm = "0.28"
