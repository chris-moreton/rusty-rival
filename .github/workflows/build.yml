  epd-runner:
    name: epd-runner tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to reviewed commits: actions/checkout v4.2.2 and the stable
      # branch of dtolnay/rust-toolchain as of 2026-09-03.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - run: cargo test -p epd-runner

  epd-regression:
    name: EPD regression (bratko-kopec + wac at 100k nodes)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Build the engine and the runner
        run: cargo build --release && cargo build --release -p epd-runner
      # Node-limited, so the runner's speed does not matter; the committed
      # baseline is rusty-rival 1.0.64. A search change legitimately moves
      # these counts, so the job fails only on a drop beyond --max-drop and
      # otherwise just reports the delta on the pull request.
      - name: Check against the committed baseline
        id: check
        run: |
          set +e
          target/release/epd-runner check --engine target/release/rusty-rival \
            --baseline rusty-rival:1.0.64 --suites bratko-kopec,wac --nodes 100000 \
            --max-drop 2 --concurrency 2 | tee check.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # Fork pull requests get a read-only token, so the comment is skipped
      # for them and never blocks the verdict below.
      - name: Post the delta on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- epd-regression -->'
            echo '#### EPD regression check (bratko-kopec + wac at 100k nodes vs rusty-rival 1.0.64)'
            echo '```'
            cat check.txt
            echo '```'
          } > comment.md
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- epd-regression -->"))] | last | .id' | tail -1)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
      - name: Fail on a drop beyond the threshold
        if: always() && steps.check.outcome != 'skipped'
        run: exit "${{ steps.check.outputs.status || 1 }}"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace -- -D warnings
