name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Matches v1.0.20, v1.0.20-rc1, v1.0.20-beta, etc.

env:
  # Extract version from tag (removes 'v' prefix)
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Run tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --release

  build:
    name: Build ${{ matrix.target }} ${{ matrix.cpu_level }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (portable baseline: x86-64-v2 = SSE4.2 + POPCNT,
          # universal since Nehalem/2008). Plain x86-64 costs roughly half the
          # engine - a software popcount plus no vectorisation of the NNUE
          # loops - and a measured ~50 Elo (NET-351).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
            extension: ""
            cpu_level: ""
            cpu_flag: "-C target-cpu=x86-64-v2"

          # Linux x86_64 AVX2 (Haswell+ 2013)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64-avx2
            extension: ""
            cpu_level: "avx2"
            cpu_flag: "-C target-cpu=x86-64-v3"

          # Windows x86_64 (portable baseline: x86-64-v2, see Linux above)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64
            extension: ".exe"
            cpu_level: ""
            cpu_flag: "-C target-cpu=x86-64-v2"

          # Windows x86_64 AVX2 (Haswell+ 2013)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64-avx2
            extension: ".exe"
            cpu_level: "avx2"
            cpu_flag: "-C target-cpu=x86-64-v3"

          # macOS Intel. NOTE: this is an AVX2 (x86-64-v3) build despite the
          # unsuffixed name - pre-Haswell Intel Macs (2007-2012, still on
          # Catalina) will SIGILL. Kept for compatibility with the existing
          # asset name that download tooling expects.
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x86_64
            extension: ""
            cpu_level: ""
            cpu_flag: "-C target-cpu=x86-64-v3"

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-aarch64
            extension: ""
            cpu_level: ""
            cpu_flag: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set binary name
        id: binary
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          echo "name=rusty-rival-${VERSION}-${{ matrix.suffix }}${{ matrix.extension }}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install LLVM profile tools
        if: matrix.suffix == 'linux-x86_64-avx2'
        run: rustup component add llvm-tools

      - name: Build Linux AVX2 with a fresh PGO profile
        if: matrix.suffix == 'linux-x86_64-avx2'
        shell: bash
        run: |
          python3 scripts/build_pgo.py \
            --positions scripts/pgo/positions.json \
            --work-dir "$RUNNER_TEMP/rival-pgo" \
            --lock-file "$RUNNER_TEMP/rival-pgo.lock" \
            --output target/x86_64-unknown-linux-gnu/release/rusty-rival

      - name: Verify Linux AVX2 profile evidence exists
        if: matrix.suffix == 'linux-x86_64-avx2'
        shell: bash
        run: |
          for evidence in provenance.json merged.profdata training.json profile-counts.txt; do
            test -s "$RUNNER_TEMP/rival-pgo/$evidence" || {
              echo "Missing or empty PGO evidence: $evidence" >&2
              exit 1
            }
          done

      - name: Archive Linux AVX2 profile provenance
        if: always() && matrix.suffix == 'linux-x86_64-avx2'
        uses: actions/upload-artifact@v4
        with:
          name: pgo-provenance-linux-x86_64-avx2
          path: |
            ${{ runner.temp }}/rival-pgo/provenance.json
            ${{ runner.temp }}/rival-pgo/merged.profdata
            ${{ runner.temp }}/rival-pgo/training.json
            ${{ runner.temp }}/rival-pgo/profile-counts.txt
            ${{ runner.temp }}/rival-pgo/*.log
          if-no-files-found: warn

      - name: Build
        if: matrix.suffix != 'linux-x86_64-avx2'
        shell: bash
        run: |
          # Set stack size flags per platform, plus optional CPU target level
          case "${{ matrix.target }}" in
            *-linux-*)
              export RUSTFLAGS="-C link-args=-Wl,-z,stack-size=8388608 ${{ matrix.cpu_flag }}"
              ;;
            *-windows-msvc)
              export RUSTFLAGS="-C link-args=/STACK:8388608 ${{ matrix.cpu_flag }}"
              ;;
            *-windows-gnu)
              export RUSTFLAGS="-C link-args=-Wl,--stack,8388608 ${{ matrix.cpu_flag }}"
              ;;
            *-apple-*)
              export RUSTFLAGS="${{ matrix.cpu_flag }}"
              ;;
          esac
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/rusty-rival ${{ steps.binary.outputs.name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/rusty-rival.exe ${{ steps.binary.outputs.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binary.outputs.name }}
          path: ${{ steps.binary.outputs.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository (for LICENSE)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rusty-rival-${{ github.ref_name }}-linux-x86_64/rusty-rival-${{ github.ref_name }}-linux-x86_64
            rusty-rival-${{ github.ref_name }}-linux-x86_64-avx2/rusty-rival-${{ github.ref_name }}-linux-x86_64-avx2
            rusty-rival-${{ github.ref_name }}-windows-x86_64.exe/rusty-rival-${{ github.ref_name }}-windows-x86_64.exe
            rusty-rival-${{ github.ref_name }}-windows-x86_64-avx2.exe/rusty-rival-${{ github.ref_name }}-windows-x86_64-avx2.exe
            rusty-rival-${{ github.ref_name }}-macos-x86_64/rusty-rival-${{ github.ref_name }}-macos-x86_64
            rusty-rival-${{ github.ref_name }}-macos-aarch64/rusty-rival-${{ github.ref_name }}-macos-aarch64
            LICENSE
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
